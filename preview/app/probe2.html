<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>probe2</title></head>
<body>
<pre id="out">running…</pre>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=20261119h"></script>
<script>
const out = [];
const log = (k, v) => { out.push(k + ': ' + v); document.getElementById('out').textContent = out.join('\n'); };

(async () => {
  log('key', (sb.supabaseKey || '').slice(0, 16) + ' len ' + (sb.supabaseKey || '').length);
  log('url', sb.supabaseUrl);
  log('sdk', (sb.headers || {})['X-Client-Info'] || '?');

  const r = await sb.from('period_records').select('id', { count: 'exact', head: true });
  log('same-client query', JSON.stringify({ count: r.count, err: r.error && r.error.message }));

  const r2 = await sb.from('user_profiles').select('id').limit(1);
  log('profiles', JSON.stringify({ rows: (r2.data || []).length, err: r2.error && r2.error.message }));

  const s = (await sb.auth.getSession()).data.session;
  log('session', s ? 'yes / exp ' + s.expires_at : 'no');
  log('done', 'yes');
})();
</script>
</body>
</html>
