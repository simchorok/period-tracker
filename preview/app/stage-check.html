<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stage check · 달의 기록 preview/app</title>
<style>
  html,body{margin:0;height:100%;background:#050308;display:flex;align-items:center;justify-content:center;overflow:hidden}
  iframe{width:390px;height:844px;border:0;display:block;background:#14101B}
</style>
</head>
<body>
<!-- 검증용 임시 프레임 (390×844). 촬영 후 삭제합니다. -->
<iframe id="f"></iframe>
<script>
  const p = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  const tab = p.get('tab') || 'home';
  f.src = './index.html?cb=' + (p.get('cb') || Date.now());
  let applied = false;
  f.addEventListener('load', () => {
    if (applied) return;
    applied = true;
    const w = f.contentWindow;
    setTimeout(() => {
      const sp = w.document.getElementById('splash');
      if (sp) { sp.classList.add('gone'); sp.style.display = 'none'; }
      if (tab !== 'home') w.switchTab(tab);
    }, 2600);
  });
</script>
</body>
</html>
