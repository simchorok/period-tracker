<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>probe</title></head>
<body>
<pre id="out">running…</pre>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL_ = 'https://nzxtpfgjiysmkecktekw.supabase.co';
const KEY = 'sb_publishable_ad3WJqIrRSfKrpQYFjyTHA_DzktkuUA';
const out = [];
const log = (k, v) => { out.push(k + ': ' + v); document.getElementById('out').textContent = out.join('\n'); };

(async () => {
  const b = supabase.createClient(URL_, KEY);
  const s = (await b.auth.getSession()).data.session;
  log('session', s ? 'yes' : 'no');
  if (s) log('tokenAlg', JSON.parse(atob(s.access_token.split('.')[0])).alg + ' / len ' + s.access_token.length);

  const q = '/rest/v1/period_records?select=id&limit=1';

  const r1 = await fetch(URL_ + q, { headers: { apikey: KEY } });
  log('apikey only', r1.status + ' ' + (await r1.text()).slice(0, 120));

  if (s) {
    const r2 = await fetch(URL_ + q, { headers: { apikey: KEY, Authorization: 'Bearer ' + s.access_token } });
    log('apikey+session', r2.status + ' ' + (await r2.text()).slice(0, 160));
  }

  const r3 = await b.from('period_records').select('id', { count: 'exact', head: true });
  log('sdk query', JSON.stringify({ count: r3.count, err: r3.error && r3.error.message }));

  const r4 = await b.from('user_profiles').select('created_at').limit(1);
  log('sdk profiles', JSON.stringify({ rows: (r4.data || []).length, err: r4.error && r4.error.message }));
  log('done', 'yes');
})();
</script>
</body>
</html>
