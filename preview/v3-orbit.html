<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>달의 기록 — 3안 달 궤도 오브제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Gowun+Batang:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#14101B;
    --bg-2:#1A1424;
    --ink:#F4EFE8;
    --ink-70:rgba(244,239,232,.70);
    --ink-45:rgba(244,239,232,.45);
    --ink-28:rgba(244,239,232,.28);
    --line:rgba(255,255,255,.09);
    --card:linear-gradient(180deg, rgba(255,255,255,.062), rgba(255,255,255,.024));
    --spring:#A9E3C6;
    --summer:#F2CE8C;
    --autumn:#D9A08B;
    --winter:#A6B8DE;
    --latin:'Cormorant Garamond', 'Times New Roman', serif;
    --serif:'Gowun Batang', serif;
    --sans:'Pretendard', 'Noto Sans KR', -apple-system, system-ui, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; margin:0}
  body{
    background:#0B0910; display:flex; align-items:center; justify-content:center;
    font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  .phone{
    position:relative; width:100%; max-width:390px; height:100dvh; max-height:844px;
    overflow:hidden; background:var(--bg);
    border-radius:40px; box-shadow:0 40px 90px -24px #000, 0 0 0 1px rgba(255,255,255,.06);
  }
  @media (max-width:520px){ .phone{max-height:none; border-radius:0} }
  html.embedded, html.embedded body{background:transparent; display:block}
  html.embedded .phone{max-width:none; max-height:none; height:100dvh; border-radius:0; box-shadow:none}

  /* 배경 광원 */
  .glowbg{position:absolute; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(58% 32% at 50% 22%, rgba(169,227,198,.13), transparent 70%),
      radial-gradient(90% 50% at 50% 108%, rgba(166,184,222,.10), transparent 72%),
      linear-gradient(180deg,#171120 0%, #14101B 52%, #100C16 100%);
  }

  .screen{position:absolute; inset:0; z-index:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:98px}
  .screen::-webkit-scrollbar{display:none}

  /* ── 스플래시 ── */
  .splash{
    position:absolute; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(70% 45% at 50% 42%, #201828 0%, #14101B 58%, #0D0A13 100%);
    transition:opacity .9s ease, transform 1.1s cubic-bezier(.22,.61,.36,1);
  }
  .splash.gone{opacity:0; transform:scale(1.05); pointer-events:none}
  .splash-orbit{width:250px; height:250px; position:relative; opacity:0; animation:orbIn 1.2s ease forwards .15s}
  @keyframes orbIn{to{opacity:1}}
  .splash-orbit svg{width:100%; height:100%; display:block; transform-origin:50% 50%; animation:orbSpin 2.6s cubic-bezier(.3,.7,.2,1) forwards .15s}
  @keyframes orbSpin{from{transform:rotate(-52deg)} to{transform:rotate(0)}}
  .splash-orbit .ring{stroke-dasharray:800; stroke-dashoffset:800; animation:draw 2.2s cubic-bezier(.4,0,.2,1) forwards .2s}
  @keyframes draw{to{stroke-dashoffset:0}}
  .splash-moon{
    position:absolute; left:50%; top:50%; width:96px; height:96px; transform:translate(-50%,-50%) scale(.7);
    opacity:0; animation:moonUp 1.6s cubic-bezier(.22,.61,.36,1) forwards .75s;
    filter:drop-shadow(0 0 30px rgba(242,206,140,.35));
  }
  @keyframes moonUp{to{opacity:1; transform:translate(-50%,-50%) scale(1)}}

  .splash-copy{position:relative; margin-top:44px; text-align:center; opacity:0; transform:translateY(10px);
    animation:up 1s cubic-bezier(.22,.61,.36,1) forwards 1.55s}
  .splash-logo{font-size:23px; font-weight:300; letter-spacing:.34em; text-indent:.34em; color:#F6F1EA}
  .splash-sub{
    margin-top:12px; font-size:9px; letter-spacing:.42em; text-transform:uppercase; color:rgba(244,239,232,.38);
  }
  .splash-line{
    margin-top:26px; font-family:var(--serif); font-size:12.5px; color:rgba(244,239,232,.55); letter-spacing:.06em;
    opacity:0; animation:up 1s ease forwards 1.95s;
  }
  .splash-foot{
    position:absolute; bottom:34px; left:0; right:0; text-align:center;
    font-size:8.5px; letter-spacing:.36em; text-transform:uppercase; color:rgba(244,239,232,.24);
    opacity:0; animation:up 1s ease forwards 2.4s;
  }
  .skip{
    position:absolute; top:44px; right:24px; z-index:3; background:none; border:0; padding:8px; cursor:pointer;
    font-family:var(--latin); font-size:10px; letter-spacing:.24em; color:rgba(244,239,232,.34);
    opacity:0; animation:up .8s ease forwards 1s;
  }
  @keyframes up{to{opacity:1; transform:translateY(0)}}

  /* ── 홈 ── */
  .home{opacity:0; transition:opacity 1s ease .15s}
  .home.in{opacity:1}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:20px 24px 6px}
  .tb-left{display:flex; align-items:center; gap:11px}
  .avatar{
    width:36px; height:36px; border-radius:50%; display:grid; place-items:center;
    background:linear-gradient(150deg, rgba(169,227,198,.22), rgba(166,184,222,.16));
    border:1px solid rgba(255,255,255,.12);
  }
  .avatar svg{width:18px; height:18px}
  .tb-name{font-size:13px; font-weight:500; letter-spacing:.01em}
  .tb-date{font-size:10px; color:var(--ink-45); margin-top:3px; letter-spacing:.06em}
  .tb-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:rgba(255,255,255,.03);
    display:grid; place-items:center; cursor:pointer;
  }

  /* 궤도 */
  .orb{position:relative; margin:4px auto 0; width:100%; max-width:314px; aspect-ratio:1/1}
  .orb svg.ring-svg{width:100%; height:100%; display:block; overflow:visible}
  .orb-center{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .orb-moon{width:94px; height:94px; display:block; filter:drop-shadow(0 0 24px rgba(242,206,140,.22))}
  .orb-day{display:flex; align-items:baseline; justify-content:center; gap:5px; margin-top:6px}
  .orb-day .n{font-family:var(--latin); font-weight:300; font-size:38px; line-height:.86; letter-spacing:-.02em; color:#FBF6EE}
  .orb-day .u{font-size:11px; color:var(--ink-70); letter-spacing:.06em}
  .orb-season{
    margin-top:8px; font-size:11px; letter-spacing:.28em; text-indent:.28em;
    color:var(--spring); text-transform:uppercase;
  }
  .orb-caption{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:10px; letter-spacing:.1em; color:var(--ink-45); margin-top:0;
  }
  .orb-caption i{width:14px; height:1px; background:var(--line)}

  .legend{display:flex; justify-content:center; gap:14px; margin:6px 0 0; padding:0 16px}
  .legend span{display:flex; align-items:center; gap:5px; font-size:10px; letter-spacing:.06em; color:var(--ink-45)}
  .legend i{width:5px; height:5px; border-radius:50%; display:block}
  .legend span.on{color:var(--ink)}
  .legend span.on i{box-shadow:0 0 8px currentColor}

  /* 인사이트 카드 */
  .insight{
    margin:16px 18px 0; padding:16px 16px 15px; border-radius:18px;
    background:var(--card); border:1px solid var(--line);
    backdrop-filter:blur(6px);
  }
  .ins-head{display:flex; align-items:center; gap:8px}
  .ins-head svg{width:14px; height:14px}
  .ins-head b{font-size:10px; font-weight:500; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-45)}
  .ins-text{margin:9px 0 0; font-family:var(--serif); font-size:14px; line-height:1.8; color:#EBE5DC}
  .ins-text em{font-style:normal; color:var(--spring)}
  .ins-tags{display:flex; gap:6px; margin-top:11px; flex-wrap:wrap}
  .ins-tags span{
    font-size:9.5px; letter-spacing:.04em; color:var(--ink-70); padding:4px 10px; border-radius:999px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.07);
  }

  /* 예정 */
  .sched{margin:14px 18px 0; border-radius:18px; background:rgba(255,255,255,.028); border:1px solid var(--line); overflow:hidden}
  .sched-row{display:flex; align-items:center; gap:12px; padding:12px 15px}
  .sched-row + .sched-row{border-top:1px solid rgba(255,255,255,.06)}
  .sched-row .ic{width:15px; height:15px; opacity:.8}
  .sched-row .k{font-size:11.5px; color:var(--ink-45); letter-spacing:.03em}
  .sched-row .v{margin-left:auto; font-family:var(--latin); font-size:15px; color:#F4EFE8; letter-spacing:.02em}
  .sched-row .v small{font-family:var(--sans); font-size:9.5px; color:var(--ink-28); margin-left:5px; letter-spacing:.02em}

  .actions{display:flex; gap:9px; margin:14px 18px 0}
  .btn{
    flex:1; border:0; cursor:pointer; border-radius:14px; padding:15px 10px;
    display:flex; align-items:center; justify-content:center; gap:7px;
    font-family:var(--sans); font-size:12.5px; font-weight:500; letter-spacing:.02em;
    transition:transform .15s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.985); opacity:.8}
  .btn.solid{background:linear-gradient(135deg,#BFEBD6,#9FDCC1); color:#10221C}
  .btn.ghost{background:rgba(255,255,255,.055); color:#E8E2D9; border:1px solid var(--line)}

  .foot-note{margin:16px 20px 4px; text-align:center; font-size:8.5px; letter-spacing:.34em; text-transform:uppercase; color:rgba(244,239,232,.16)}

  /* 하단 네비 */
  .tabbar{
    position:absolute; left:0; right:0; bottom:0; z-index:20;
    display:flex; align-items:center; justify-content:space-around;
    padding:11px 10px calc(13px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(20,16,27,0) 0%, rgba(20,16,27,.9) 45%, #100C16 100%);
    border-top:1px solid rgba(255,255,255,.06);
  }
  .tab{background:none; border:0; cursor:pointer; padding:4px 10px; display:flex; flex-direction:column; align-items:center; gap:5px; color:rgba(244,239,232,.34); position:relative}
  .tab svg{width:20px; height:20px; display:block}
  .tab span{font-size:9.5px; letter-spacing:.02em}
  .tab.active{color:var(--ink)}
  .tab.active::before{
    content:''; position:absolute; top:-11px; left:50%; transform:translateX(-50%);
    width:22px; height:2px; border-radius:2px; background:linear-gradient(90deg,transparent,var(--spring),transparent);
    box-shadow:0 0 10px rgba(169,227,198,.6);
  }
</style>
</head>
<body>
<div class="phone">
  <div class="glowbg"></div>

  <!-- ───────── 스플래시 ───────── -->
  <div class="splash" id="splash">
    <button class="skip" id="skip" aria-label="건너뛰기">SKIP</button>

    <div class="splash-orbit">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <circle class="ring" cx="120" cy="120" r="104" fill="none" stroke="rgba(255,255,255,.20)" stroke-width="1"/>
        <circle cx="120" cy="120" r="120" fill="none" stroke="rgba(169,227,198,.20)" stroke-width="1" stroke-dasharray="1 7"/>
        <circle cx="120" cy="120" r="88" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
        <circle cx="120" cy="16" r="3" fill="#A9E3C6"/>
      </svg>
      <svg class="splash-moon" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <radialGradient id="spMoon" cx="36%" cy="30%" r="76%">
            <stop offset="0%" stop-color="#FFFDF6"/>
            <stop offset="55%" stop-color="#F6E6C6"/>
            <stop offset="100%" stop-color="#C9AE83"/>
          </radialGradient>
        </defs>
        <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.14)" stroke-width=".7"/>
        <path d="M50,8 A42,42 0 0 1 50,92 A18.5,42 0 0 1 50,8 Z" fill="url(#spMoon)"/>
        <circle cx="63" cy="40" r="5" fill="rgba(120,96,60,.13)"/>
        <circle cx="66" cy="64" r="3.2" fill="rgba(120,96,60,.11)"/>
      </svg>
    </div>

    <div class="splash-copy">
      <div class="splash-logo">달의 기록</div>
      <div class="splash-sub">Moon cycle tracker</div>
    </div>
    <div class="splash-line">달마다 달라지는 나의 리듬</div>
    <div class="splash-foot">Simchorok · 2026</div>
  </div>

  <!-- ───────── 홈 ───────── -->
  <div class="screen home" id="home">

    <div class="topbar">
      <div class="tb-left">
        <div class="avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="#CFE9DC" stroke-width="1.2" stroke-linecap="round">
            <path d="M19.6 15.1A8.1 8.1 0 0 1 8.9 4.4a8.1 8.1 0 1 0 10.7 10.7Z"/>
          </svg>
        </div>
        <div>
          <div class="tb-name">심초록</div>
          <div class="tb-date">11월 19일 목요일</div>
        </div>
      </div>
      <button class="tb-btn" aria-label="알림">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(244,239,232,.6)" stroke-width="1.3" stroke-linecap="round">
          <path d="M18 15.4V10a6 6 0 1 0-12 0v5.4L4.4 18h15.2L18 15.4Z"/>
          <path d="M10 21h4"/>
        </svg>
      </button>
    </div>

    <div class="orb">
      <svg class="ring-svg" id="orbitSvg" viewBox="0 0 342 342" aria-label="28일 주기 궤도">
        <defs>
          <linearGradient id="progGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#D9C9A6"/>
            <stop offset="55%" stop-color="#BFEBD6"/>
            <stop offset="100%" stop-color="#A9E3C6"/>
          </linearGradient>
          <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle cx="171" cy="171" r="150" fill="none" stroke="rgba(255,255,255,.05)" stroke-width=".8"/>
        <g id="orbitTicks"></g>
        <g id="orbitArcs"></g>
        <g id="orbitProgress"></g>
      </svg>

      <div class="orb-center">
        <svg class="orb-moon" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <radialGradient id="moonLit" cx="36%" cy="30%" r="76%">
              <stop offset="0%" stop-color="#FFFDF6"/>
              <stop offset="52%" stop-color="#F7E8C9"/>
              <stop offset="100%" stop-color="#CBB086"/>
            </radialGradient>
          </defs>
          <circle cx="50" cy="50" r="42" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.10)" stroke-width=".7"/>
          <path d="M50,8 A42,42 0 0 1 50,92 A18.5,42 0 0 1 50,8 Z" fill="url(#moonLit)"/>
          <circle cx="63" cy="40" r="5" fill="rgba(105,84,52,.12)"/>
          <circle cx="66" cy="64" r="3.2" fill="rgba(105,84,52,.10)"/>
          <circle cx="40" cy="72" r="2.4" fill="rgba(105,84,52,.07)"/>
        </svg>
        <div class="orb-day"><span class="n">9</span><span class="u">일째</span></div>
        <div class="orb-season">여포기</div>
      </div>
    </div>

    <div class="orb-caption"><i></i><span>28일 주기 · 봄의 계절</span><i></i></div>

    <div class="legend">
      <span><i style="background:var(--winter)"></i>겨울</span>
      <span class="on"><i style="background:var(--spring)"></i>봄</span>
      <span><i style="background:var(--summer)"></i>여름</span>
      <span><i style="background:var(--autumn)"></i>가을</span>
    </div>

    <div class="insight">
      <div class="ins-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="#A9E3C6" stroke-width="1.3" stroke-linecap="round">
          <path d="M12 3.6v2.2M12 18.2v2.2M3.6 12h2.2M18.2 12h2.2M6.4 6.4l1.6 1.6M16 16l1.6 1.6M17.6 6.4 16 8M8 16l-1.6 1.6"/>
          <circle cx="12" cy="12" r="3.4"/>
        </svg>
        <b>오늘의 결</b>
      </div>
      <p class="ins-text">기운이 다시 차오르는 <em>봄의 구간</em>이에요. 몸이 가볍고 집중이 잘 되는 날, 미뤄둔 일을 꺼내보기 좋아요.</p>
      <div class="ins-tags"><span>에너지 상승</span><span>집중</span><span>가벼운 운동</span></div>
    </div>

    <div class="sched">
      <div class="sched-row">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#F2CE8C" stroke-width="1.3" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4"/>
        </svg>
        <span class="k">배란 예정</span>
        <span class="v">12.05<small>16일 후</small></span>
      </div>
      <div class="sched-row">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#A9E3C6" stroke-width="1.3" stroke-linecap="round">
          <path d="M12 20.4S4.6 15.9 4.6 10.6A4.4 4.4 0 0 1 12 7.8a4.4 4.4 0 0 1 7.4 2.8c0 5.3-7.4 9.8-7.4 9.8Z"/>
        </svg>
        <span class="k">가임기</span>
        <span class="v">11.30 – 12.06</span>
      </div>
      <div class="sched-row">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#A6B8DE" stroke-width="1.3" stroke-linecap="round">
          <path d="M12 3.2c3.4 4 5.4 6.7 5.4 9.2a5.4 5.4 0 0 1-10.8 0c0-2.5 2-5.2 5.4-9.2Z"/>
        </svg>
        <span class="k">다음 생리</span>
        <span class="v">12.19<small>30일 후</small></span>
      </div>
    </div>

    <div class="actions">
      <button class="btn solid">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#10221C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20h4.2L19 9.2a2.2 2.2 0 0 0-3.1-3.1L5 16.9V20Z"/>
        </svg>
        오늘 기록
      </button>
      <button class="btn ghost">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/>
          <path d="M8.3 10.7 15.7 6.3M8.3 13.3l7.4 4.4"/>
        </svg>
        상태 공유
      </button>
    </div>

    <div class="foot-note">The record of the moon</div>
  </div>

  <!-- ───────── 하단 네비 ───────── -->
  <nav class="tabbar" aria-label="주요 메뉴">
    <button class="tab active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
        <path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8Z"/>
      </svg>
      <span>홈</span>
    </button>
    <button class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
        <rect x="3.4" y="5.2" width="17.2" height="15.4" rx="2.6"/>
        <path d="M3.4 9.8h17.2M8 3.4v3.4M16 3.4v3.4"/>
      </svg>
      <span>달력</span>
    </button>
    <button class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.6 16.4 8 10.9l3.6 3.1 4-6.2 4.8 6.1"/>
        <path d="M3.6 20.2h16.8"/>
      </svg>
      <span>그래프</span>
    </button>
    <button class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
        <circle cx="12" cy="8.4" r="3.6"/>
        <path d="M5.4 20c.6-3.6 3.3-5.6 6.6-5.6s6 2 6.6 5.6"/>
      </svg>
      <span>마이</span>
    </button>
  </nav>
</div>

<script>
(function(){
  if (window.self !== window.top) document.documentElement.classList.add('embedded');

  /* ── 28일 궤도 ── */
  var CX = 171, CY = 171, R = 132, N = 28;
  var DAY = 9;
  function pol(r, deg){ var a = (deg - 90) * Math.PI / 180; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; }
  function pt(r, day){ return pol(r, (day - 1) * 360 / N); }
  function arcPath(r, d1, d2){
    var s = pt(r, d1), e = pt(r, d2);
    var span = (d2 - d1) * 360 / N;
    var large = span > 180 ? 1 : 0;
    return 'M' + s[0].toFixed(2) + ',' + s[1].toFixed(2) + ' A' + r + ',' + r + ' 0 ' + large + ' 1 ' + e[0].toFixed(2) + ',' + e[1].toFixed(2);
  }

  /* 눈금 28개 */
  var ticks = '';
  for (var d = 1; d <= N; d++){
    var major = (d === 1 || d === DAY);
    var r1 = major ? R - 10 : R - 6, r2 = R + (major ? 10 : 6);
    var a = pt(r1, d), b = pt(r2, d);
    ticks += '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) +
             '" stroke="' + (d <= DAY ? 'rgba(255,255,255,.30)' : 'rgba(255,255,255,.13)') + '" stroke-width="' + (major ? 1.4 : 1) + '" stroke-linecap="round"/>';
  }
  document.getElementById('orbitTicks').innerHTML = ticks;

  /* 사계절 아크 — 겨울 1~6, 봄 6~13.44, 여름 13.44~17.64, 가을 17.64~29 */
  var seasons = [
    { from:1,    to:6,      color:'#A6B8DE' },
    { from:6,    to:13.44,  color:'#A9E3C6' },
    { from:13.44,to:17.64,  color:'#F2CE8C' },
    { from:17.64,to:29,     color:'#D9A08B' }
  ];
  var arcs = '';
  seasons.forEach(function(s){
    var from = s.from + 0.9, to = s.to - 0.9;
    if (to <= from) return;
    var active = DAY >= s.from && DAY < s.to;
    arcs += '<path d="' + arcPath(R, from, to) + '" fill="none" stroke="' + s.color +
            '" stroke-width="' + (active ? 3 : 2) + '" stroke-linecap="round" opacity="' + (active ? '.95' : '.34') + '"/>';
  });
  document.getElementById('orbitArcs').innerHTML = arcs;

  /* 오늘까지 지나온 아크 */
  var prog = '<path d="' + arcPath(R, 1, DAY) + '" fill="none" stroke="url(#progGrad)" stroke-width="3.2" stroke-linecap="round" opacity=".9" filter="url(#dotGlow)"/>';
  var m = pt(R, DAY);
  prog += '<circle cx="' + m[0].toFixed(1) + '" cy="' + m[1].toFixed(1) + '" r="9" fill="#A9E3C6" opacity=".16"/>';
  prog += '<circle cx="' + m[0].toFixed(1) + '" cy="' + m[1].toFixed(1) + '" r="4.4" fill="#FBF6EE" filter="url(#dotGlow)"/>';
  prog += '<circle cx="' + m[0].toFixed(1) + '" cy="' + m[1].toFixed(1) + '" r="1.9" fill="#A9E3C6"/>';
  document.getElementById('orbitProgress').innerHTML = prog;

  /* ── 스플래시 ── */
  var splash = document.getElementById('splash');
  var home = document.getElementById('home');
  var timer = null;

  function enterHome(){
    if (timer) { clearTimeout(timer); timer = null; }
    splash.classList.add('gone');
    home.classList.add('in');
  }
  window.replaySplash = function(){
    if (timer) clearTimeout(timer);
    splash.innerHTML = splash.innerHTML;
    splash.classList.remove('gone');
    home.classList.remove('in');
    splash.querySelector('.skip').addEventListener('click', enterHome);
    timer = setTimeout(enterHome, 3300);
  };
  window.showHome = function(){
    if (timer) { clearTimeout(timer); timer = null; }
    splash.classList.add('gone'); home.classList.add('in');
  };
  document.getElementById('skip').addEventListener('click', enterHome);
  timer = setTimeout(enterHome, 3300);
})();
</script>
</body>
</html>
