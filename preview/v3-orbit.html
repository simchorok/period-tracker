<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>달의 기록 — 3안 달 궤도 오브제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Gowun+Batang:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#14101B;
    --bg-2:#1A1424;
    --ink:#F4EFE8;
    --ink-70:rgba(244,239,232,.70);
    --ink-45:rgba(244,239,232,.45);
    --ink-28:rgba(244,239,232,.28);
    --line:rgba(255,255,255,.09);
    --spring:#A9E3C6;
    --summer:#F2CE8C;
    --autumn:#D9A08B;
    --winter:#A6B8DE;
    --latin:'Cormorant Garamond', 'Times New Roman', serif;
    --serif:'Gowun Batang', serif;
    --sans:'Pretendard', 'Noto Sans KR', -apple-system, system-ui, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; margin:0}
  body{
    background:#0B0910; display:flex; align-items:center; justify-content:center;
    font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  .phone{
    position:relative; width:100%; max-width:390px; height:100dvh; max-height:844px;
    overflow:hidden; background:var(--bg);
    border-radius:40px; box-shadow:0 40px 90px -24px #000, 0 0 0 1px rgba(255,255,255,.06);
  }
  @media (max-width:520px){ .phone{max-height:none; border-radius:0} }
  html.embedded, html.embedded body{background:transparent; display:block}
  html.embedded .phone{max-width:none; max-height:none; height:100dvh; border-radius:0; box-shadow:none}

  /* 배경 광원 */
  .glowbg{position:absolute; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(56% 30% at 50% 34%, rgba(169,227,198,.12), transparent 72%),
      radial-gradient(94% 52% at 50% 110%, rgba(166,184,222,.10), transparent 74%),
      linear-gradient(180deg,#171120 0%, #14101B 54%, #100C16 100%);
  }

  .screen{position:absolute; inset:0; z-index:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:98px}
  .screen::-webkit-scrollbar{display:none}

  /* ── 스플래시 ── */
  .splash{
    position:absolute; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(70% 45% at 50% 42%, #201828 0%, #14101B 58%, #0D0A13 100%);
    transition:opacity .9s ease, transform 1.1s cubic-bezier(.22,.61,.36,1);
  }
  .splash.gone{opacity:0; transform:scale(1.05); pointer-events:none}
  .splash-orbit{width:250px; height:250px; position:relative; opacity:0; animation:orbIn 1.2s ease forwards .15s}
  @keyframes orbIn{to{opacity:1}}
  .splash-orbit svg{width:100%; height:100%; display:block; transform-origin:50% 50%; animation:orbSpin 2.6s cubic-bezier(.3,.7,.2,1) forwards .15s}
  @keyframes orbSpin{from{transform:rotate(-52deg)} to{transform:rotate(0)}}
  .splash-orbit .ring{stroke-dasharray:800; stroke-dashoffset:800; animation:draw 2.2s cubic-bezier(.4,0,.2,1) forwards .2s}
  @keyframes draw{to{stroke-dashoffset:0}}
  .splash-moon{
    position:absolute; left:50%; top:50%; width:96px; height:96px; transform:translate(-50%,-50%) scale(.7);
    opacity:0; animation:moonUp 1.6s cubic-bezier(.22,.61,.36,1) forwards .75s;
    filter:drop-shadow(0 0 30px rgba(242,206,140,.35));
  }
  @keyframes moonUp{to{opacity:1; transform:translate(-50%,-50%) scale(1)}}

  .splash-copy{position:relative; margin-top:44px; text-align:center; opacity:0; transform:translateY(10px);
    animation:up 1s cubic-bezier(.22,.61,.36,1) forwards 1.55s}
  .splash-logo{font-size:23px; font-weight:300; letter-spacing:.34em; text-indent:.34em; color:#F6F1EA}
  .splash-sub{
    margin-top:12px; font-size:9px; letter-spacing:.42em; text-transform:uppercase; color:rgba(244,239,232,.38);
  }
  .splash-line{
    margin-top:26px; font-family:var(--serif); font-size:12.5px; color:rgba(244,239,232,.55); letter-spacing:.06em;
    opacity:0; animation:up 1s ease forwards 1.95s;
  }
  .splash-foot{
    position:absolute; bottom:34px; left:0; right:0; text-align:center;
    font-size:8.5px; letter-spacing:.36em; text-transform:uppercase; color:rgba(244,239,232,.24);
    opacity:0; animation:up 1s ease forwards 2.4s;
  }
  .skip{
    position:absolute; top:44px; right:24px; z-index:3; background:none; border:0; padding:8px; cursor:pointer;
    font-family:var(--latin); font-size:10px; letter-spacing:.24em; color:rgba(244,239,232,.34);
    opacity:0; animation:up .8s ease forwards 1s;
  }
  @keyframes up{to{opacity:1; transform:translateY(0)}}

  /* ── 홈 ── */
  .home{opacity:0; transition:opacity 1s ease .15s; display:flex; flex-direction:column}
  .home.in{opacity:1}

  /* 아주 조용한 상단 — 워드마크 하나 */
  .mark{flex:0 0 auto; padding:30px 0 2px; text-align:center}
  .mark .word{
    font-family:var(--serif); font-size:13px; font-weight:400;
    letter-spacing:.46em; text-indent:.46em; color:rgba(244,239,232,.66);
  }

  /* 중앙 궤도 — 화면의 주인공 */
  .stage{
    flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center;
    padding:2px 16px 0;
  }
  .orb{position:relative; width:100%; max-width:358px; aspect-ratio:1/1}
  .orb svg.ring-svg{width:100%; height:100%; display:block; overflow:visible}
  .orb .dash{animation:orbitDrift 120s linear infinite}
  @keyframes orbitDrift{to{stroke-dashoffset:-1056}}
  .orb .halo{animation:halo 4.2s ease-in-out infinite}
  @keyframes halo{0%,100%{opacity:.13} 50%{opacity:.26}}

  .orb-center{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .orb-moon{width:110px; height:110px; display:block; filter:drop-shadow(0 0 30px rgba(242,206,140,.26))}
  .orb-day{display:flex; align-items:baseline; justify-content:center; gap:6px; margin-top:10px}
  .orb-day .n{font-family:var(--latin); font-weight:300; font-size:46px; line-height:.84; letter-spacing:-.03em; color:#FBF6EE}
  .orb-day .u{font-size:11px; color:var(--ink-45); letter-spacing:.10em}
  .orb-season{
    margin-top:12px; font-size:11px; letter-spacing:.34em; text-indent:.34em;
    color:var(--spring); text-transform:uppercase;
  }

  /* 짧은 힌트 하나 */
  .hint{
    width:max-content; margin:0 auto; display:flex; align-items:center; gap:8px;
    padding:8px 15px; border-radius:999px;
    border:1px solid rgba(255,255,255,.07); background:rgba(255,255,255,.022);
    font-size:10px; letter-spacing:.12em; color:var(--ink-45);
  }
  .hint i{width:4px; height:4px; border-radius:50%; background:var(--winter); display:block; opacity:.85}

  /* 하단 액션 */
  .foot{flex:0 0 auto; padding:0 22px 30px}
  .actions{display:flex; gap:10px; margin-top:20px}
  .btn{
    flex:1; border:0; cursor:pointer; border-radius:16px; height:52px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:var(--sans); font-size:12.5px; font-weight:500; letter-spacing:.04em;
    transition:transform .15s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.985); opacity:.82}
  .btn.solid{background:linear-gradient(135deg,#C4EFDB,#9FDCC1); color:#0F211B}
  .btn.ghost{background:rgba(255,255,255,.045); color:rgba(244,239,232,.82); border:1px solid rgba(255,255,255,.09)}
  .btn svg{width:15px; height:15px; flex:0 0 auto}

  /* 하단 네비 */
  .tabbar{
    position:absolute; left:0; right:0; bottom:0; z-index:20;
    display:flex; align-items:center; justify-content:space-around;
    padding:12px 10px calc(15px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(20,16,27,0) 0%, rgba(20,16,27,.92) 45%, #100C16 100%);
    border-top:1px solid rgba(255,255,255,.05);
  }
  .tab{background:none; border:0; cursor:pointer; padding:4px 10px; display:flex; flex-direction:column; align-items:center; gap:6px; color:rgba(244,239,232,.30); position:relative}
  .tab svg{width:20px; height:20px; display:block}
  .tab span{font-size:9px; letter-spacing:.06em}
  .tab.active{color:rgba(244,239,232,.92)}
  .tab.active::before{
    content:''; position:absolute; top:-12px; left:50%; transform:translateX(-50%);
    width:20px; height:2px; border-radius:2px; background:linear-gradient(90deg,transparent,var(--spring),transparent);
    box-shadow:0 0 10px rgba(169,227,198,.55);
  }

  @media (prefers-reduced-motion: reduce){
    .orb .dash{animation:none}
    .orb .halo{animation:none; opacity:.18}
  }

  /* 낮은 화면에서는 궤도만 살짝 줄인다 */
  @media (max-height: 830px){
    .mark{padding-top:22px}
    .orb{max-width:300px}
    .orb-moon{width:94px; height:94px}
    .orb-day .n{font-size:38px}
    .orb-season{font-size:10px; margin-top:9px}
    .foot{padding-bottom:22px}
    .actions{margin-top:16px}
    .btn{height:48px; border-radius:14px}
  }
  @media (max-height: 700px){
    .mark{padding-top:16px}
    .orb{max-width:264px}
    .orb-moon{width:80px; height:80px}
    .orb-day .n{font-size:32px}
    .foot{padding-bottom:16px}
    .actions{margin-top:12px}
  }
</style>
</head>
<body>
<div class="phone">
  <div class="glowbg"></div>

  <!-- ───────── 스플래시 ───────── -->
  <div class="splash" id="splash">
    <button class="skip" id="skip" aria-label="건너뛰기">SKIP</button>

    <div class="splash-orbit">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <circle class="ring" cx="120" cy="120" r="104" fill="none" stroke="rgba(255,255,255,.20)" stroke-width="1"/>
        <circle cx="120" cy="120" r="120" fill="none" stroke="rgba(169,227,198,.20)" stroke-width="1" stroke-dasharray="1 7"/>
        <circle cx="120" cy="120" r="88" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
        <circle cx="120" cy="16" r="3" fill="#A9E3C6"/>
      </svg>
      <svg class="splash-moon" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <radialGradient id="spMoon" cx="36%" cy="30%" r="76%">
            <stop offset="0%" stop-color="#FFFDF6"/>
            <stop offset="55%" stop-color="#F6E6C6"/>
            <stop offset="100%" stop-color="#C9AE83"/>
          </radialGradient>
        </defs>
        <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.14)" stroke-width=".7"/>
        <path d="M50,8 A42,42 0 0 1 50,92 A18.5,42 0 0 1 50,8 Z" fill="url(#spMoon)"/>
        <circle cx="63" cy="40" r="5" fill="rgba(120,96,60,.13)"/>
        <circle cx="66" cy="64" r="3.2" fill="rgba(120,96,60,.11)"/>
      </svg>
    </div>

    <div class="splash-copy">
      <div class="splash-logo">달의 기록</div>
      <div class="splash-sub">Moon cycle tracker</div>
    </div>
    <div class="splash-line">달마다 달라지는 나의 리듬</div>
    <div class="splash-foot">Simchorok · 2026</div>
  </div>

  <!-- ───────── 홈 ───────── -->
  <div class="screen home" id="home">

    <header class="mark">
      <div class="word">달의 기록</div>
    </header>

    <div class="stage">
      <div class="orb">
        <svg class="ring-svg" id="orbitSvg" viewBox="0 0 360 360" role="img" aria-label="28일 주기 궤도, 9일째 여포기">
          <defs>
            <linearGradient id="progGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#D9C9A6"/>
              <stop offset="55%" stop-color="#BFEBD6"/>
              <stop offset="100%" stop-color="#A9E3C6"/>
            </linearGradient>
            <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
              <feGaussianBlur stdDeviation="4" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <circle cx="180" cy="180" r="177" fill="none" stroke="rgba(255,255,255,.035)" stroke-width="1"/>
          <circle class="dash" cx="180" cy="180" r="168" fill="none" stroke="rgba(169,227,198,.16)" stroke-width="1" stroke-dasharray="1 9" stroke-linecap="round"/>
          <circle cx="180" cy="180" r="158" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
          <g id="orbitTicks"></g>
          <g id="orbitArcs"></g>
          <g id="orbitProgress"></g>
        </svg>

        <div class="orb-center">
          <svg class="orb-moon" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <radialGradient id="moonLit" cx="36%" cy="30%" r="76%">
                <stop offset="0%" stop-color="#FFFDF6"/>
                <stop offset="52%" stop-color="#F7E8C9"/>
                <stop offset="100%" stop-color="#CBB086"/>
              </radialGradient>
            </defs>
            <circle cx="50" cy="50" r="42" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.10)" stroke-width=".7"/>
            <path d="M50,8 A42,42 0 0 1 50,92 A18.5,42 0 0 1 50,8 Z" fill="url(#moonLit)"/>
            <circle cx="63" cy="40" r="5" fill="rgba(105,84,52,.12)"/>
            <circle cx="66" cy="64" r="3.2" fill="rgba(105,84,52,.10)"/>
            <circle cx="40" cy="72" r="2.4" fill="rgba(105,84,52,.07)"/>
          </svg>
          <div class="orb-day"><span class="n">9</span><span class="u">일째</span></div>
          <div class="orb-season">여포기</div>
        </div>
      </div>
    </div>

    <footer class="foot">
      <div class="hint"><i></i>다음 생리 D-19</div>
      <div class="actions">
        <button class="btn solid">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0F211B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20h4.2L19 9.2a2.2 2.2 0 0 0-3.1-3.1L5 16.9V20Z"/>
          </svg>
          기록하기
        </button>
        <button class="btn ghost">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/>
            <path d="M8.3 10.7 15.7 6.3M8.3 13.3l7.4 4.4"/>
          </svg>
          공유
        </button>
      </div>
    </footer>
  </div>

  <!-- ───────── 하단 네비 ───────── -->
  <nav class="tabbar" aria-label="주요 메뉴">
    <button class="tab active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
        <path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8Z"/>
      </svg>
      <span>홈</span>
    </button>
    <button class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
        <rect x="3.4" y="5.2" width="17.2" height="15.4" rx="2.6"/>
        <path d="M3.4 9.8h17.2M8 3.4v3.4M16 3.4v3.4"/>
      </svg>
      <span>달력</span>
    </button>
    <button class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.6 16.4 8 10.9l3.6 3.1 4-6.2 4.8 6.1"/>
        <path d="M3.6 20.2h16.8"/>
      </svg>
      <span>그래프</span>
    </button>
    <button class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
        <circle cx="12" cy="8.4" r="3.6"/>
        <path d="M5.4 20c.6-3.6 3.3-5.6 6.6-5.6s6 2 6.6 5.6"/>
      </svg>
      <span>마이</span>
    </button>
  </nav>
</div>

<script>
(function(){
  if (window.self !== window.top) document.documentElement.classList.add('embedded');

  /* ── 28일 궤도 ── */
  var CX = 180, CY = 180, R = 138, N = 28;
  var DAY = 9;
  function pol(r, deg){ var a = (deg - 90) * Math.PI / 180; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; }
  function pt(r, day){ return pol(r, (day - 1) * 360 / N); }
  function arcPath(r, d1, d2){
    var s = pt(r, d1), e = pt(r, d2);
    var span = (d2 - d1) * 360 / N;
    var large = span > 180 ? 1 : 0;
    return 'M' + s[0].toFixed(2) + ',' + s[1].toFixed(2) + ' A' + r + ',' + r + ' 0 ' + large + ' 1 ' + e[0].toFixed(2) + ',' + e[1].toFixed(2);
  }

  /* 눈금 28개 */
  var ticks = '';
  for (var d = 1; d <= N; d++){
    var major = (d === 1 || d === DAY);
    var r1 = major ? R - 10 : R - 6, r2 = R + (major ? 10 : 6);
    var a = pt(r1, d), b = pt(r2, d);
    ticks += '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) +
             '" stroke="' + (d <= DAY ? 'rgba(255,255,255,.30)' : 'rgba(255,255,255,.12)') + '" stroke-width="' + (major ? 1.4 : 1) + '" stroke-linecap="round"/>';
  }
  document.getElementById('orbitTicks').innerHTML = ticks;

  /* 사계절 아크 — 겨울 1~6, 봄 6~13.44, 여름 13.44~17.64, 가을 17.64~29 */
  var seasons = [
    { from:1,    to:6,      color:'#A6B8DE' },
    { from:6,    to:13.44,  color:'#A9E3C6' },
    { from:13.44,to:17.64,  color:'#F2CE8C' },
    { from:17.64,to:29,     color:'#D9A08B' }
  ];
  var arcs = '';
  seasons.forEach(function(s){
    var from = s.from + 0.9, to = s.to - 0.9;
    if (to <= from) return;
    var active = DAY >= s.from && DAY < s.to;
    arcs += '<path d="' + arcPath(R, from, to) + '" fill="none" stroke="' + s.color +
            '" stroke-width="' + (active ? 3 : 2) + '" stroke-linecap="round" opacity="' + (active ? '.95' : '.30') + '"/>';
  });
  document.getElementById('orbitArcs').innerHTML = arcs;

  /* 오늘까지 지나온 아크 */
  var prog = '<path d="' + arcPath(R, 1, DAY) + '" fill="none" stroke="url(#progGrad)" stroke-width="3" stroke-linecap="round" opacity=".9" filter="url(#dotGlow)"/>';
  var m = pt(R, DAY);
  prog += '<circle class="halo" cx="' + m[0].toFixed(1) + '" cy="' + m[1].toFixed(1) + '" r="11" fill="#A9E3C6" opacity=".16"/>';
  prog += '<circle cx="' + m[0].toFixed(1) + '" cy="' + m[1].toFixed(1) + '" r="4.2" fill="#FBF6EE" filter="url(#dotGlow)"/>';
  prog += '<circle cx="' + m[0].toFixed(1) + '" cy="' + m[1].toFixed(1) + '" r="1.8" fill="#A9E3C6"/>';
  document.getElementById('orbitProgress').innerHTML = prog;

  /* ── 스플래시 ── */
  var splash = document.getElementById('splash');
  var home = document.getElementById('home');
  var timer = null;

  function enterHome(){
    if (timer) { clearTimeout(timer); timer = null; }
    splash.classList.add('gone');
    home.classList.add('in');
  }
  window.replaySplash = function(){
    if (timer) clearTimeout(timer);
    splash.innerHTML = splash.innerHTML;
    splash.classList.remove('gone');
    home.classList.remove('in');
    splash.querySelector('.skip').addEventListener('click', enterHome);
    timer = setTimeout(enterHome, 3300);
  };
  window.showHome = function(){
    if (timer) { clearTimeout(timer); timer = null; }
    splash.classList.add('gone'); home.classList.add('in');
  };
  document.getElementById('skip').addEventListener('click', enterHome);
  timer = setTimeout(enterHome, 3300);
})();
</script>
</body>
</html>
